[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Configuración de Flash (16MB) y PSRAM (QSPI) típica del módulo Waveshare ESP32-S3-Touch-AMOLED-1.75
board_build.arduino.memory_type = qio_qspi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB

monitor_speed = 115200

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Configuración de LVGL por flags sin requerir archivo externo lv_conf.h
    -D LV_CONF_SKIP
    -D LV_COLOR_FORMAT_DEFAULT=LV_COLOR_FORMAT_RGB565
    -D LV_USE_LOG=1
    -D LV_FONT_MONTSERRAT_16=1
    -D LV_FONT_MONTSERRAT_24=1
    -D LV_FONT_MONTSERRAT_28=1
    -D LV_FONT_MONTSERRAT_48=1

lib_deps =
    lvgl/lvgl@^9.2.0
    h2zero/NimBLE-Arduino@^1.4.2
    bblanchon/ArduinoJson@^6.21.5
    https://github.com/moononournation/Arduino_GFX.git
